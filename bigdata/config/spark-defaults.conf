# Referencia de la configuración Spark usada por el pipeline.
# El pipeline la aplica desde bigdata/config/pipeline.json (sección "spark");
# este archivo sirve para spark-submit o para un clúster:  spark-submit --properties-file bigdata/config/spark-defaults.conf ...
spark.master                          local[*]
spark.driver.memory                   2g
spark.sql.shuffle.partitions          8
spark.sql.adaptive.enabled            true
spark.sql.autoBroadcastJoinThreshold  10485760
spark.sql.session.timeZone            America/Lima
spark.sql.parquet.compression.codec   snappy
spark.eventLog.enabled                true
spark.eventLog.dir                    file:./logs/spark-events
spark.history.fs.logDirectory         file:./logs/spark-events
